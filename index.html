<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC 101 GenBio Practice Exam</title>
<style>
:root{--bg:#07111f;--card:#0e1b2c;--text:#f7f9fc;--muted:#a9b7c8;--line:#29405d;--blue:#79b8ff;--green:#7ee0a3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(135deg,#07111f,#0a1628 45%,#0d2034);color:var(--text);min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:24px 16px 48px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(24px,4vw,38px);margin:0 0 6px}.sub{margin:0;color:var(--muted)}.scorebox{background:#0c192a;border:1px solid var(--line);padding:10px 14px;border-radius:16px;font-weight:800}
.progress{height:10px;background:#132238;border-radius:999px;overflow:hidden;margin:14px 0 22px;border:1px solid #1d3452}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.25s}
.card{background:rgba(14,27,44,.97);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.28);border-radius:24px;padding:clamp(20px,4vw,36px)}
.kicker{display:inline-flex;padding:7px 11px;border-radius:999px;background:#132941;color:#b9d8ff;font-size:13px;font-weight:900}.qnum{color:var(--muted);font-size:14px;margin-top:14px}
h2{font-size:clamp(22px,3.4vw,31px);line-height:1.25;margin:10px 0 22px}.choices{display:grid;gap:12px}
.choice{width:100%;text-align:left;border:1px solid #2c4564;background:#102037;color:var(--text);padding:15px 16px;border-radius:15px;font-size:16px;cursor:pointer}.choice:hover{border-color:#4f7097}
.choice.correct{border-color:#4ed58b;background:#123927}.choice.wrong{border-color:#ff7a7a;background:#3b2028}.choice:disabled{cursor:default}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:16px;border:1px solid var(--line);line-height:1.55}.feedback.good{display:block;background:#0f3425;border-color:#2d8056}.feedback.bad{display:block;background:#3a2027;border-color:#8c4352}
.actions{display:flex;justify-content:flex-end;margin-top:18px}.next,.start,.restart,.checklabels{border:0;background:linear-gradient(90deg,#6eb6ff,#80e0a4);color:#05101d;font-weight:900;padding:13px 18px;border-radius:14px;cursor:pointer;font-size:15px}.next:disabled{opacity:.35}
.hero{text-align:center;padding:20px 6px 8px}.hero .big{font-size:clamp(34px,7vw,62px);font-weight:950;letter-spacing:-.04em;margin:8px 0}.pills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px 0}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:#c9d4e1;background:#0b1929}
.small{font-size:13px;color:var(--muted);line-height:1.5}.diagram{margin:14px 0 20px;border:1px solid var(--line);border-radius:18px;background:#f6f0df;padding:12px;overflow:hidden}
.label-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label-row{background:#102037;border:1px solid #2c4564;padding:12px;border-radius:14px}.label-row strong{display:block;margin-bottom:8px}select{width:100%;background:#0b1728;color:#fff;border:1px solid #355274;padding:10px;border-radius:10px}
.checklabels{margin-top:14px}.result{text-align:center}.result .score{font-size:64px;font-weight:950;margin:10px 0}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:#102037}.metric b{display:block;font-size:24px}
footer{text-align:center;color:#7f91a7;font-size:12px;margin-top:18px}@media(max-width:620px){.label-grid,.breakdown{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header><div><h1>BC 101 • GenBio Practice Exam</h1><p class="sub">Cellular Transport Membrane + Introduction to Genetics</p></div><div class="scorebox" id="scoreBox">Score: 0 / 0</div></header>
<div class="progress"><div id="bar"></div></div><main class="card" id="app"></main>
<footer>Practice reviewer based on the uploaded BC 101 lecture materials. Not an official examination.</footer></div>
<script>
const questions=[{"type": "mcq", "topic": "Cellular Transport", "q": "Which statement best describes the plasma membrane?", "choices": ["It is completely permeable to all substances.", "It follows the fluid mosaic model and is selectively permeable.", "It is made only of proteins.", "It is about 8 mm thick."], "a": 1, "why": "The lecture states that the plasma membrane follows the fluid mosaic model, is selectively permeable, and is only about 8 nm thin."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Which membrane component is described as the main fabric of the membrane?", "choices": ["Cholesterol", "Carbohydrate", "Phospholipid", "Protein"], "a": 2, "why": "The PPT lists phospholipid as the main fabric of the plasma membrane."}, {"type": "mcq", "topic": "Cellular Transport", "q": "What is the function of cholesterol in the plasma membrane according to the lecture?", "choices": ["Cell recognition", "Cell insulation", "ATP production", "DNA replication"], "a": 1, "why": "The membrane-components table lists cholesterol as providing cell insulation."}, {"type": "mcq", "topic": "Cellular Transport", "q": "A phospholipid is amphipathic because it has:", "choices": ["Only a hydrophilic region", "Only a hydrophobic region", "Both hydrophilic and hydrophobic regions", "Neither hydrophilic nor hydrophobic regions"], "a": 2, "why": "The PPT describes phospholipids as amphipathic, meaning they contain hydrophilic and hydrophobic regions."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Integral membrane proteins are best described as proteins that:", "choices": ["Are not embedded in the membrane at all", "Penetrate the hydrophobic core of the membrane", "Exist only outside the cell", "Are made of carbohydrate chains"], "a": 1, "why": "Integral proteins penetrate the hydrophobic core; many completely span the plasma membrane."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Peripheral proteins are found:", "choices": ["Only inside the nucleus", "Embedded through the entire bilayer", "On the periphery or sides of the membrane", "Only in lysosomes"], "a": 2, "why": "The lecture states that peripheral proteins are not embedded in the membrane and are found at its periphery or sides."}, {"type": "mcq", "topic": "Cellular Transport", "q": "A glycolipid is:", "choices": ["A sugar chain covalently bonded to a lipid", "A sugar chain covalently bonded to a protein", "A protein bonded to DNA", "A lipid bonded to ATP"], "a": 0, "why": "The PPT defines glycolipids as sugar chains covalently bonded to lipids."}, {"type": "mcq", "topic": "Cellular Transport", "q": "A glycoprotein is:", "choices": ["A lipid with two fatty acid tails", "A sugar chain covalently bonded to a protein", "A protein that never enters a membrane", "A phosphate bonded to glucose"], "a": 1, "why": "The PPT defines glycoproteins as sugar chains covalently bonded to proteins."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Which membrane-protein function involves a binding site shaped to fit a chemical messenger such as a hormone?", "choices": ["Signal transduction", "Cell insulation", "Phagocytosis", "Osmosis"], "a": 0, "why": "The signal-transduction slide describes a membrane protein with a specific binding site for a chemical messenger such as a hormone."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Some glycoproteins act as identification tags. This function is called:", "choices": ["Enzymatic activity", "Cell-to-cell recognition", "Primary active transport", "Diffusion"], "a": 1, "why": "The PPT states that some glycoproteins serve as identification tags specifically recognized by proteins of other cells."}, {"type": "mcq", "topic": "Cellular Transport", "q": "A transporter that moves one substance in one direction depending on the concentration gradient is a:", "choices": ["Antiporter", "Symporter", "Uniporter", "Peripheral protein"], "a": 2, "why": "The lecture defines a uniporter as transporting substances in a unidirectional manner depending on the concentration gradient."}, {"type": "mcq", "topic": "Cellular Transport", "q": "A transport protein moves two different types of molecules at the same time in the SAME direction. It is a:", "choices": ["Antiporter", "Uniporter", "Symporter", "Glycoprotein"], "a": 2, "why": "Symporters move different types of molecules together in the same direction. Antiporters move them in opposite directions."}, {"type": "mcq", "topic": "Cellular Transport", "q": "A transport protein moves two different types of molecules in opposite directions at the same time. It is a:", "choices": ["Antiporter", "Uniporter", "Symporter", "Peripheral protein"], "a": 0, "why": "The lecture defines an antiporter as transporting different molecules in opposite directions at the same time."}, {"type": "mcq", "topic": "Cellular Transport", "q": "When substances move in the direction of their concentration gradient:", "choices": ["Extra metabolic energy is always required", "No external energy output is needed", "ATP must be hydrolyzed first", "Endocytosis must occur"], "a": 1, "why": "The PPT states that movement in the direction of the concentration gradient does not require energy output from external factors."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Passive transport is movement across a membrane:", "choices": ["With no energy investment", "Only by vesicles", "Always against a concentration gradient", "Only through pumps"], "a": 0, "why": "The lecture defines passive transport as movement across a membrane with no energy investment."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Facilitated transport uses:", "choices": ["DNA polymerase", "Specific transmembrane protein channels", "Only phospholipids and no proteins", "Clathrin-coated vesicles"], "a": 1, "why": "The facilitated-transport slide says it utilizes transmembrane protein channels that are specific to certain molecules."}, {"type": "mcq", "topic": "Cellular Transport", "q": "In primary active transport, how many Na⁺ ions bind to the pump before ATP hydrolysis?", "choices": ["1", "2", "3", "4"], "a": 2, "why": "The PPT specifically states that three Na ions bind to their active sites on the pump before ATP is hydrolyzed."}, {"type": "mcq", "topic": "Cellular Transport", "q": "After Na⁺ ions are released in the sodium-potassium pump cycle, how many K⁺ ions bind to the pump?", "choices": ["1", "2", "3", "4"], "a": 1, "why": "The secondary active transport slide states that the pump binds two K ions, which are transported into the cell."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Phagocytosis is endocytosis of:", "choices": ["Liquid material", "Particulate material", "Only sodium ions", "Only oxygen"], "a": 1, "why": "The PPT defines phagocytosis as endocytosis of particulate material."}, {"type": "mcq", "topic": "Cellular Transport", "q": "Pinocytosis is endocytosis of:", "choices": ["Liquid material", "Particulate material only", "DNA", "Potassium ions"], "a": 0, "why": "The PPT defines pinocytosis as endocytosis of liquid material."}, {"type": "mcq", "topic": "Genetics", "q": "Genetics is the study of:", "choices": ["Cellular respiration", "Heredity", "Photosynthesis", "Tissue repair"], "a": 1, "why": "The lecture defines genetics as the study of heredity."}, {"type": "mcq", "topic": "Genetics", "q": "Why did Mendel choose garden peas for his experiments?", "choices": ["They cannot self-pollinate", "They are difficult to grow", "They are easily grown and their pollination can be controlled", "They reproduce only asexually"], "a": 2, "why": "The PPT states that peas are easily grown and their pollination is easily controlled."}, {"type": "mcq", "topic": "Genetics", "q": "True-breeding plants are plants that:", "choices": ["Always produce hybrids", "Self-pollinate and produce offspring identical to themselves", "Have two different alleles for every trait", "Cannot reproduce"], "a": 1, "why": "The lecture defines true-breeding as self-pollinating plants that produce offspring identical to themselves."}, {"type": "mcq", "topic": "Genetics", "q": "An organism with two identical alleles such as TT or tt is:", "choices": ["Heterozygous", "Homozygous", "Hybrid only", "Codominant"], "a": 1, "why": "Homozygous means having two identical alleles, such as TT or tt."}, {"type": "mcq", "topic": "Genetics", "q": "An organism with two different alleles such as Tt is:", "choices": ["Homozygous", "Heterozygous", "Recessive only", "Polygenic"], "a": 1, "why": "Heterozygous means having two different alleles, such as Tt."}, {"type": "mcq", "topic": "Genetics", "q": "Which term means the physical characteristic of an organism, such as tall or short?", "choices": ["Genotype", "Phenotype", "Allele", "Gamete"], "a": 1, "why": "Phenotype refers to the physical characteristic or observable trait."}, {"type": "mcq", "topic": "Genetics", "q": "Which term means genetic makeup, such as TT, Tt, or tt?", "choices": ["Phenotype", "Genotype", "Trait only", "Environment"], "a": 1, "why": "Genotype refers to the genetic makeup represented by allele combinations such as TT, Tt, or tt."}, {"type": "mcq", "topic": "Genetics", "q": "A Punnett square is used to show:", "choices": ["The structure of DNA", "Possible outcomes of breeding between two individuals", "The stages of mitosis only", "Cell membrane thickness"], "a": 1, "why": "The PPT defines a Punnett square as a diagram showing the possible outcomes of breeding between two individuals."}, {"type": "mcq", "topic": "Genetics", "q": "A test cross is used to determine:", "choices": ["The age of an organism", "The unknown genotype of an organism with a dominant phenotype", "The number of chromosomes in a cell", "Whether a membrane is selectively permeable"], "a": 1, "why": "Mendel used a test cross to test organisms with an unknown genotype by crossing the dominant-phenotype organism with a recessive organism."}, {"type": "mcq", "topic": "Genetics", "q": "A monohybrid cross involves:", "choices": ["A single trait or character factor", "Two pairs of alleles", "Only sex-linked genes", "No alleles"], "a": 0, "why": "The lecture defines a monohybrid cross as crossbreeding involving a single trait or character factor."}, {"type": "mcq", "topic": "Genetics", "q": "A dihybrid cross involves:", "choices": ["Only one allele", "Two pairs of alleles", "No parental generation", "Only recessive phenotypes"], "a": 1, "why": "The PPT defines a dihybrid cross as crossing traits using two pairs of alleles."}, {"type": "mcq", "topic": "Genetics", "q": "For a heterozygous monohybrid cross Tt × Tt, the phenotypic ratio is:", "choices": ["1:1", "2:1", "3:1", "9:3:3:1"], "a": 2, "why": "The probability slide gives the classic monohybrid phenotype ratio of 3 tall : 1 short."}, {"type": "mcq", "topic": "Genetics", "q": "For a standard dihybrid cross of two heterozygotes, the familiar phenotypic ratio is:", "choices": ["3:1", "1:2:1", "9:3:3:1", "1:1"], "a": 2, "why": "A heterozygous dihybrid cross produces the classic 9:3:3:1 phenotypic ratio in the Mendelian example used in the lecture."}, {"type": "mcq", "topic": "Genetics", "q": "Which Mendelian law states that hereditary factors separate so each gamete receives one factor from a pair?", "choices": ["Law of Segregation", "Law of Use and Disuse", "Law of Acquired Characteristics", "Fluid Mosaic Law"], "a": 0, "why": "The Law of Segregation states that paired hereditary factors separate during gamete formation."}, {"type": "mcq", "topic": "Genetics", "q": "Incomplete dominance results in:", "choices": ["Only the recessive trait appearing", "An intermediate phenotype between the two parental phenotypes", "Both parental traits appearing separately with no blending", "No phenotype"], "a": 1, "why": "The PPT defines incomplete dominance as inheritance in which an intermediate phenotype is observed."}, {"type": "mcq", "topic": "Genetics", "q": "In codominance:", "choices": ["The two parental traits blend into an intermediate phenotype", "Only the dominant allele is expressed", "Both parental traits are displayed", "Neither allele is expressed"], "a": 2, "why": "The lecture states that both parental traits are displayed in codominance; unlike incomplete dominance, they are not blended."}, {"type": "mcq", "topic": "Genetics", "q": "The ABO blood-group system is an example of:", "choices": ["Multiple alleles", "Only complete dominance", "A single environmental trait", "No inheritance"], "a": 0, "why": "The genetics lecture includes ABO blood groups under multiple-allele inheritance."}, {"type": "mcq", "topic": "Genetics", "q": "Rabbit fur color controlled by four alleles is an example of:", "choices": ["Multiple alleles", "Monohybrid dominance only", "Osmosis", "Cell recognition"], "a": 0, "why": "The PPT gives rabbit fur color controlled by four alleles as an example of multiple alleles."}, {"type": "mcq", "topic": "Genetics", "q": "A polygenic trait is controlled by:", "choices": ["One gene only", "Two or more genes", "Only the environment", "No genes"], "a": 1, "why": "The lecture defines polygenic traits as traits controlled by two or more genes."}, {"type": "mcq", "topic": "Genetics", "q": "Which statement matches the lecture's discussion of genetics and environment?", "choices": ["Characteristics are determined only by genes.", "Characteristics can be influenced by interaction between genes and the environment.", "Environment completely replaces genes.", "Genes have no role in inherited traits."], "a": 1, "why": "The final genetics slide states that characteristics are not solely determined by genes; they are also shaped by gene–environment interaction."}, {"type": "illustration", "topic": "Illustration", "q": "Illustration: Identify the labeled structures in this simplified plasma membrane diagram.", "labels": [{"n": "1", "answer": "Hydrophilic heads", "choices": ["Hydrophilic heads", "Hydrophobic tails", "Integral protein", "Carbohydrate chain"]}, {"n": "2", "answer": "Hydrophobic tails", "choices": ["Hydrophilic heads", "Hydrophobic tails", "Integral protein", "Cholesterol"]}, {"n": "3", "answer": "Integral protein", "choices": ["Peripheral protein", "Integral protein", "Phospholipid head", "Carbohydrate chain"]}, {"n": "4", "answer": "Carbohydrate chain", "choices": ["Fatty acid tail", "Carbohydrate chain", "Cytoplasm", "ATP"]}], "why": "The plasma-membrane diagrams in the lecture show hydrophilic phospholipid heads facing watery environments, hydrophobic tails inside the bilayer, integral proteins spanning the membrane, and carbohydrate chains projecting from the outer surface."}, {"type": "problem", "topic": "Problem Solving", "q": "Problem 1 — Monohybrid cross: In pea plants, green pod (G) is dominant over yellow pod (g). A heterozygous green-pod plant self-pollinates: Gg × Gg. Which result is correct?", "choices": ["Genotype 1 GG : 2 Gg : 1 gg; phenotype 3 green : 1 yellow", "Genotype 3 GG : 1 gg; phenotype 1 green : 1 yellow", "All Gg; all green", "Genotype 1 Gg : 3 gg; phenotype 1 green : 3 yellow"], "a": 0, "why": "Gg × Gg produces GG, Gg, Gg, gg. That gives a 1:2:1 genotypic ratio and a 3:1 green-to-yellow phenotypic ratio."}, {"type": "problem", "topic": "Problem Solving", "q": "Problem 2 — Dihybrid cross: If G = green (dominant), g = yellow, T = tall (dominant), and t = short, what is the phenotype ratio for GgTt × GgTt?", "choices": ["3:1", "1:2:1", "9 green-tall : 3 green-short : 3 yellow-tall : 1 yellow-short", "1 green-tall : 1 green-short : 1 yellow-tall : 1 yellow-short"], "a": 2, "why": "The 16 outcomes group into 9 G_T_, 3 G_tt, 3 ggT_, and 1 ggtt, giving the familiar 9:3:3:1 ratio."}];
let idx=-1,score=0,answered=false;
const app=document.getElementById('app'),scoreBox=document.getElementById('scoreBox'),bar=document.getElementById('bar');
function updateTop(){scoreBox.textContent=`Score: ${score} / ${Math.max(idx,0)}`;bar.style.width=idx<0?'0%':`${Math.min(100,(idx/questions.length)*100)}%`}
function intro(){idx=-1;score=0;answered=false;app.innerHTML=`<div class="hero"><div class="kicker">43 ITEMS • ONE AT A TIME</div><div class="big">Practice like the real thing.</div><p>40 multiple-choice questions, 1 membrane illustration, and 2 genetics problem-solving items. Get immediate feedback, the correct answer, and a short explanation after every response.</p><div class="pills"><span class="pill">20 Cellular Transport MCQs</span><span class="pill">20 Genetics MCQs</span><span class="pill">1 Illustration</span><span class="pill">2 Problems</span></div><button class="start" onclick="start()">Start Practice Exam</button><p class="small">Your score stays on this device only. Refreshing resets the attempt.</p></div>`;updateTop()}
function start(){idx=0;score=0;render()}
function render(){answered=false;const q=questions[idx];updateTop();const type=q.type==='mcq'?'Multiple Choice':q.type==='illustration'?'Illustration':'Problem Solving';let b=`<div class="kicker">${q.topic} • ${type}</div><div class="qnum">Question ${idx+1} of ${questions.length}</div><h2>${q.q}</h2>`;
if(q.type==='illustration'){b+=diagramHTML();b+=`<div class="label-grid">${q.labels.map(x=>`<div class="label-row"><strong>Label ${x.n}</strong><select id="lab${x.n}"><option value="">Choose…</option>${x.choices.map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')}</div><button class="checklabels" onclick="checkIllustration()">Check Illustration</button>`}
else{b+=`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="answer(${i},this)"><b>${String.fromCharCode(65+i)}.</b> ${c}</button>`).join('')}</div>`}
b+=`<div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="next" onclick="nextQ()" disabled>${idx===questions.length-1?'See Results':'Next Question →'}</button></div>`;app.innerHTML=b}
function answer(choice,el){if(answered)return;answered=true;const q=questions[idx],buttons=[...document.querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);const ok=choice===q.a;if(ok){score++;el.classList.add('correct')}else{el.classList.add('wrong');buttons[q.a].classList.add('correct')}const fb=document.getElementById('feedback');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'✅ Correct!':'❌ Not quite.'}</b><br>${ok?'':`Correct answer: <b>${String.fromCharCode(65+q.a)}. ${q.choices[q.a]}</b><br>`}${q.why}`;document.getElementById('next').disabled=false;updateTop()}
function checkIllustration(){if(answered)return;const q=questions[idx];let c=0,d=[];q.labels.forEach(x=>{const s=document.getElementById('lab'+x.n);if(s.value===x.answer)c++;else d.push(`Label ${x.n} = <b>${x.answer}</b>`);s.disabled=true});answered=true;const ok=c===q.labels.length;if(ok)score++;const fb=document.getElementById('feedback');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'✅ Correct!':`❌ You got ${c} of ${q.labels.length} labels correct.`}</b><br>${d.length?'Correct labels: '+d.join(' • ')+'<br>':''}${q.why}`;document.querySelector('.checklabels').disabled=true;document.getElementById('next').disabled=false;updateTop()}
function nextQ(){if(!answered)return;if(idx===questions.length-1)return results();idx++;render()}
function results(){bar.style.width='100%';scoreBox.textContent=`Score: ${score} / ${questions.length}`;const pct=Math.round(score/questions.length*100);const msg=pct>=90?'Excellent recall.':pct>=75?'Strong work — review the misses once more.':pct>=60?'Good start — another round will help.':'Use the explanations as your next review guide.';app.innerHTML=`<div class="result"><div class="kicker">EXAM COMPLETE</div><div class="score">${score}/${questions.length}</div><h2>${pct}%</h2><p>${msg}</p><div class="breakdown"><div class="metric"><b>40</b><span>MCQs</span></div><div class="metric"><b>1</b><span>Illustration</span></div><div class="metric"><b>2</b><span>Problems</span></div></div><button class="restart" onclick="intro()">Try Again</button></div>`}
function diagramHTML(){let units='';for(let i=0;i<18;i++){const x=35+i*42;units+=`<g transform="translate(${x},0)"><circle cx="0" cy="110" r="13" fill="#4f86c6"/><line x1="-5" y1="122" x2="-8" y2="165" stroke="#d0a444" stroke-width="7"/><line x1="5" y1="122" x2="8" y2="165" stroke="#d0a444" stroke-width="7"/><circle cx="0" cy="220" r="13" fill="#4f86c6"/><line x1="-5" y1="208" x2="-8" y2="165" stroke="#d0a444" stroke-width="7"/><line x1="5" y1="208" x2="8" y2="165" stroke="#d0a444" stroke-width="7"/></g>`}
return `<div class="diagram"><svg viewBox="0 0 820 330" width="100%"><rect width="820" height="330" fill="#f6f0df"/><text x="28" y="35" font-size="18" fill="#384354">Extracellular fluid</text><text x="28" y="312" font-size="18" fill="#384354">Cytoplasm</text>${units}<rect x="350" y="82" rx="26" width="85" height="166" fill="#8e62bd" stroke="#65438c" stroke-width="4"/><path d="M610,95 C610,70 590,70 590,48 M590,48 C570,48 570,25 550,25 M590,48 C610,48 620,28 638,30" fill="none" stroke="#2e9d67" stroke-width="8" stroke-linecap="round"/><g font-family="Arial" font-size="22" font-weight="700" fill="#182532"><circle cx="110" cy="74" r="18" fill="#fff" stroke="#182532"/><text x="104" y="82">1</text><line x1="128" y1="78" x2="165" y2="103" stroke="#182532" stroke-width="3"/><circle cx="240" cy="178" r="18" fill="#fff" stroke="#182532"/><text x="234" y="186">2</text><line x1="258" y1="178" x2="300" y2="166" stroke="#182532" stroke-width="3"/><circle cx="470" cy="166" r="18" fill="#fff" stroke="#182532"/><text x="464" y="174">3</text><line x1="452" y1="166" x2="432" y2="166" stroke="#182532" stroke-width="3"/><circle cx="690" cy="48" r="18" fill="#fff" stroke="#182532"/><text x="684" y="56">4</text><line x1="672" y1="49" x2="637" y2="42" stroke="#182532" stroke-width="3"/></g></svg></div>`}
intro();
</script></body></html>
